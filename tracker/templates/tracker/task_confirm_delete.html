{% extends "base.html" %}

{% block title %}Delete Task — Project Task Tracker{% endblock %}

{% block extra_head %}
<style>
  .confirm-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 2rem; max-width: 480px; }
  .confirm-card h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.75rem; }
  .confirm-card p { font-size: 0.9rem; color: #374151; margin-bottom: 1.5rem; }
  .form-actions { display: flex; gap: 0.75rem; align-items: center; }
  .btn-danger { padding: 0.55rem 1.25rem; background: #dc2626; color: #fff; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 500; cursor: pointer; }
  .btn-danger:hover { background: #b91c1c; }
  .btn-cancel { font-size: 0.875rem; color: #64748b; text-decoration: none; }
  .btn-cancel:hover { color: #1e293b; }
</style>
{% endblock %}

{% block content %}
<div class="confirm-card">
  <h1>Delete Task</h1>
  <p>Are you sure you want to delete <strong>{{ task.title }}</strong>? This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <button type="submit" class="btn-danger">Delete</button>
      <a class="btn-cancel" href="{% url 'task_detail' task.pk %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
