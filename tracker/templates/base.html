<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Project Task Tracker{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #1a1a1a; }
    nav { background: #1e293b; color: #f8fafc; padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 52px; }
    nav a { color: #94a3b8; text-decoration: none; font-size: 0.875rem; }
    nav a:hover { color: #f8fafc; }
    .nav-brand { font-weight: 600; font-size: 1rem; color: #f8fafc; }
    .nav-right { display: flex; align-items: center; gap: 1.25rem; font-size: 0.875rem; }
    .nav-user { color: #cbd5e1; }
    .nav-role { font-size: 0.75rem; background: #334155; color: #94a3b8; padding: 2px 6px; border-radius: 4px; margin-left: 4px; }
    main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav>
    <span class="nav-brand">Project Task Tracker</span>
    <div class="nav-right">
      {% if user.is_authenticated %}
        <a href="{% url 'project_list' %}">Projects</a>
        <span class="nav-user">
          {{ user.username }}
          <span class="nav-role">{{ user.role }}</span>
        </span>
        <a href="{% url 'logout' %}">Log out</a>
      {% else %}
        <a href="{% url 'login' %}">Log in</a>
      {% endif %}
    </div>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
